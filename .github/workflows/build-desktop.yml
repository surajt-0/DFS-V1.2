name: Build desktop app

# PyInstaller doesn't cross-compile -- an .exe can only be built on Windows,
# a macOS .app only on macOS, etc. This matrix runs the same build on all
# three OSes so you get every platform's artifact from one push, without
# needing a Windows/Mac machine yourself.
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux WebView + GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gir1.2-webkit2-4.1 python3-gi python3-gi-cairo gir1.2-gtk-3.0

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller desktop/build.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agamya-DFS-${{ runner.os }}
          path: dist/Agamya-DFS/
